name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Instalar dependencias
        run: npm ci

      - name: Construir sitio (base /manual-chery-e5)
        run: npm run build
        env:
          BASE_PATH: /manual-chery-e5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
